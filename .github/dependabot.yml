version: 2
updates:
  # Workflow actions are pinned to commit SHAs; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The browser stack is pinned as a tested set. A new launcher, Playwright,
      # or browser build needs the full browser suite in the affected mode; see
      # docs/browser-compatibility.md. Security advisories still open PRs.
      - dependency-name: playwright-core
      - dependency-name: camoufox-js
      - dependency-name: camoufox
      # typescript-eslint supports TypeScript below 6.1.
      - dependency-name: typescript
        versions: [">=6.1.0"]
